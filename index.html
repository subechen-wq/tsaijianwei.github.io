<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tsai Jian-Wei | Flutist</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #070b12;
      color: white;
      font-family: 'Noto Serif TC', 'Playfair Display', serif;
    }

    .hero {
      min-height: 100vh;
      background:
        linear-gradient(to right, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.55) 38%, rgba(0,0,0,0.12) 75%),
        url("hero.jpg") no-repeat center center / cover;
      position: relative;
      overflow: hidden;
    }

    nav {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 28px 60px;
      display: flex;
      justify-content: center;
      gap: 48px;
      z-index: 2;
      font-family: 'Montserrat', sans-serif;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.85;
    }

    nav a:hover {
      opacity: 1;
      border-bottom: 1px solid white;
      padding-bottom: 6px;
    }

    .hero-content {
      position: absolute;
      top: 50%;
      left: 8%;
      transform: translateY(-50%);
      max-width: 520px;
      animation: fadeUp 1.6s ease forwards;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 72px;
      line-height: 1.05;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .hero .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .hero .line {
      width: 70px;
      height: 1px;
      background: white;
      margin-bottom: 28px;
      opacity: 0.75;
    }

    .hero .intro {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      line-height: 1.9;
      letter-spacing: 1px;
      opacity: 0.82;
      margin-bottom: 34px;
    }

    .button {
      font-family: 'Montserrat', sans-serif;
      display: inline-block;
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.7);
      padding: 13px 28px;
      letter-spacing: 3px;
      font-size: 12px;
      transition: 0.3s;
    }

    .button:hover {
      background: white;
      color: #070b12;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(-42%);
      }
      to {
        opacity: 1;
        transform: translateY(-50%);
      }
    }

    @media (max-width: 768px) {
      nav {
        gap: 22px;
        padding: 24px 20px;
      }

      .hero {
        background:
          linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.9)),
          url("hero.jpg") no-repeat center center / cover;
      }

      .hero-content {
        left: 7%;
        right: 7%;
        top: 62%;
      }

      .hero h1 {
        font-size: 46px;
      }
    }
    .about-preview {
  background: #080808;
  color: white;
  padding: 110px 8%;
}

.about-inner {
  max-width: 780px;
  animation: fadeIn 1.4s ease forwards;
}

.about-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  letter-spacing: 5px;
  opacity: 0.6;
  margin-bottom: 22px;
}

.about-preview h2 {
  font-family: 'Playfair Display', serif;
  font-size: 46px;
  margin-bottom: 28px;
}

.about-preview p {
  font-family: 'Montserrat', sans-serif;
  font-size: 16px;
  line-height: 2;
  letter-spacing: 0.8px;
  opacity: 0.78;
  max-width: 680px;
  margin-bottom: 32px;
}

.text-link {
  font-family: 'Montserrat', sans-serif;
  color: white;
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 3px;
  border-bottom: 1px solid white;
  padding-bottom: 6px;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  </style>
</head>

<body>

  <section class="hero">
    <nav>
      <a href="#">首頁</a>
      <a href="#">關於</a>
      <a href="#">影音作品</a>
      <a href="#">聯絡邀約</a>
    </nav>

    <div class="hero-content">
      <h1>蔡<br>建瑋</h1>
      <div class="subtitle">長笛演奏家 · 音樂教育者</div>
      <div class="line"></div>
      <div class="intro">
        留德長笛博士，致力於古典音樂演奏、長笛教學與音樂藝術推廣，
        以細膩音色與深度詮釋，帶領聽眾感受長笛音樂的優雅與生命力。
      </div>
      <a class="button" href="#">了解更多</a>
    </div>
  </section>

<section class="about-preview">
  <div class="about-inner">
    <div class="about-label">關於</div>
    <h2>藝術家簡介</h2>
    <p>
      蔡建瑋為留德長笛博士，長年專注於長笛演奏、音樂教育與古典音樂推廣。
      其音樂風格融合歐洲古典訓練的嚴謹基礎與細膩真摯的個人詮釋，
      期望透過演出與教學，將長笛音樂的美感傳遞給更多聽眾與學習者。
    </p>
    <a class="text-link" href="#">閱讀更多</a>
  </div>
</section>
  
</body>
</html>
